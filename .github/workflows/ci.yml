name: ci

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check working rules (asmdef direction, file size, no scene search, no static state)
        run: python scripts/check_architecture.py

  pure-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build pure assemblies as Unity sees them (netstandard2.1, C# 9, warnings as errors)
        run: dotnet build tests/CoGaze.Pure -c Release
      - name: Run EditMode tests without Unity
        run: dotnet test tests/CoGaze.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
